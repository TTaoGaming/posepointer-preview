<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'">
  <title>Play GCompris with PosePointer</title>
  <link rel="stylesheet" href="./host.css">
</head>
<body>
  <header>
    <a href="../" class="brand">PosePointer</a>
    <button id="start-camera" type="button" disabled>Start camera</button>
    <button id="pause" type="button" disabled>Pause</button>
    <button id="kill" type="button" disabled>Stop camera</button>
    <label id="mirror-control" hidden>Mirror opacity <input id="opacity" type="range" min="0" max="100" value="35"></label>
    <output id="input-status" role="status">Camera off</output>
    <output id="offline-status">Preparing offline storage...</output>
    <a href="./credits.html">Credits</a>
  </header>
  <main id="stage">
    <video id="camera" playsinline muted hidden></video>
    <iframe id="activity" title="GCompris activities" allow="camera 'none'; microphone 'none'"></iframe>
    <canvas id="skin" aria-hidden="true"></canvas>
    <div id="cursor" aria-hidden="true" hidden></div>
    <output id="app-status" role="status">Starting...</output>
  </main>
  <script type="module" src="./host.js"></script>
</body>
</html>
